name: CI

on:
  push:
    branches: [main, phase-1a]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build without a live Groq key — app falls back to demo mode
          NEXT_PUBLIC_DEMO_MODE: 'true'
