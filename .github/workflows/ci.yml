name: CI

on:
  push:
    branches: [main, phase-1a, ascend-frontend-rebuild]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Check for em dashes
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          result = subprocess.run(
              ['git', 'ls-files'],
              capture_output=True, text=True, check=True
          )
          tracked = [
              f for f in result.stdout.splitlines()
              if not f.startswith('node_modules/')
              and not f.startswith('.next/')
              and not f.endswith('.lock')
              and not f.endswith('.png')
              and not f.endswith('.jpg')
              and not f.endswith('.ico')
              and not f.endswith('.woff')
              and not f.endswith('.woff2')
              and not f.endswith('.ttf')
              and not f.endswith('.eot')
          ]
          em_dash   = chr(0x2014)
          mdash_ent = '&' + 'mdash' + ';'
          dec_ent   = '&' + '#8212' + ';'
          found = []
          for path in tracked:
              try:
                  with open(path, encoding='utf-8', errors='ignore') as fh:
                      for i, line in enumerate(fh, 1):
                          if em_dash in line or mdash_ent in line or dec_ent in line:
                              found.append(f'{path}:{i}: {line.rstrip()}')
              except (OSError, IsADirectoryError):
                  pass
          if found:
              print('Em dashes found in tracked source files:')
              for hit in found:
                  print(' ', hit)
              sys.exit(1)
          print(f'OK: zero em dashes in {len(tracked)} tracked files.')
          EOF

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build without a live Groq key: app falls back to demo mode
          NEXT_PUBLIC_DEMO_MODE: 'true'
